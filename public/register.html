<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tạo tài khoản — Bảng điều khiển bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="login-shell">
  <div class="login-card">
    <h1>Tạo tài khoản</h1>
    <p class="lead" id="lead">Đang tải…</p>

    <div class="note" id="note"></div>

    <form id="form">
      <div class="field">
        <label for="u">Tên đăng nhập</label>
        <input type="text" id="u" autocomplete="username" autocapitalize="off" required>
      </div>
      <div class="field">
        <label for="p">Mật khẩu (tối thiểu 8 ký tự)</label>
        <input type="password" id="p" autocomplete="new-password" required>
      </div>
      <button class="primary wide" type="submit" id="btn">Tạo tài khoản</button>
    </form>

    <p style="margin-top:1.2rem;font-size:0.85rem;color:var(--dim)">
      Đã có tài khoản? <a href="/login.html">Đăng nhập</a>
    </p>
  </div>
</main>

<script>
const note = document.getElementById("note");

fetch("/api/public").then(r => r.json()).then(d => {
  if (!d.signupOpen) {
    document.getElementById("form").hidden = true;
    document.getElementById("lead").textContent = "Đăng ký đang tạm đóng. Liên hệ quản trị viên để được cấp tài khoản.";
    return;
  }
  document.getElementById("lead").textContent = d.trialDays > 0
    ? `Dùng thử miễn phí ${d.trialDays} ngày, không cần thanh toán trước.`
    : "Tạo tài khoản rồi chọn gói thuê trong bảng điều khiển.";
});

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btn");
  btn.disabled = true;
  note.className = "note"; note.textContent = "";
  try {
    const r = await fetch("/api/register", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("u").value,
        password: document.getElementById("p").value,
      }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Tạo tài khoản thất bại");
    location.href = "/dashboard.html";
  } catch (err) {
    note.className = "note bad";
    note.textContent = err.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
