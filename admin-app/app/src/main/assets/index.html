<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>botctl</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="top">
  <div class="brand"><span class="pr">&gt;_</span> botctl</div>
  <button id="host" class="host" data-act="ping" aria-label="Kiểm tra máy chủ"><i class="dot"></i><span id="hostName">chưa kết nối</span><span id="lat" class="dim"></span></button>
  <button class="icon" data-act="palette" aria-label="Bảng lệnh">⌘</button>
</header>

<main id="main">
  <section id="v-overview" class="view"></section>
  <section id="v-users" class="view" hidden></section>
  <section id="v-money" class="view" hidden></section>
  <section id="v-logs" class="view" hidden></section>
  <section id="v-api" class="view" hidden></section>
  <section id="v-manage" class="view" hidden></section>
  <section id="v-config" class="view" hidden></section>
</main>

<nav id="nav">
  <button data-tab="overview" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>overview</span></button>
  <button data-tab="users"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>users</span></button>
  <button data-tab="money"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.2c-.6-1-1.7-1.5-2.9-1.5-1.6 0-2.8.8-2.8 2.1 0 3 5.9 1.4 5.9 4.4 0 1.3-1.2 2.2-3 2.2-1.4 0-2.6-.6-3.2-1.7M12 6v1.7M12 16.4V18"/></svg><span>money</span></button>
  <button data-tab="logs"><svg viewBox="0 0 24 24"><path d="M4 5l6 5-6 5"/><path d="M12 19h8"/></svg><span>logs</span></button>
  <button data-tab="api"><svg viewBox="0 0 24 24"><path d="M8 4c-2 0-3 1-3 3v2c0 1.5-.8 3-2 3 1.2 0 2 1.5 2 3v2c0 2 1 3 3 3M16 4c2 0 3 1 3 3v2c0 1.5.8 3 2 3-1.2 0-2 1.5-2 3v2c0 2-1 3-3 3"/></svg><span>api</span></button>
  <button data-tab="manage"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg><span>quản trị</span></button>
  <button data-tab="config"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg><span>config</span></button>
</nav>

<div id="sheetWrap" class="overlay" hidden><div id="sheet" class="sheet"></div></div>

<div id="palette" class="overlay top" hidden>
  <div class="pal">
    <input id="palIn" type="text" placeholder="gõ lệnh…  (users, logs, ping, duyệt…)" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div id="palList"></div>
  </div>
</div>

<div id="login" class="full" hidden>
  <form id="loginForm" class="auth" autocomplete="off">
    <div class="logo"><span class="pr">&gt;_</span> botctl</div>
    <p class="dim">Bảng điều khiển dành riêng cho admin. Chỉ tài khoản quản trị mới đăng nhập được.</p>
    <label>server <input id="lgServer" type="url" inputmode="url" placeholder="https://ten-app.onrender.com" autocapitalize="off" spellcheck="false"></label>
    <label>user <input id="lgUser" type="text" autocapitalize="off" spellcheck="false" autocomplete="username"></label>
    <label>pass <input id="lgPass" type="password" autocomplete="current-password"></label>
    <div id="lgErr" class="err"></div>
    <button class="btn primary" type="submit" id="lgBtn">$ connect</button>
  </form>
</div>

<div id="lock" class="full" hidden>
  <div class="auth center">
    <div class="logo"><span class="pr">&gt;_</span> botctl</div>
    <p class="dim">Đã khoá. Xác thực bằng mật khẩu, vân tay hoặc mẫu hình của máy.</p>
    <button class="btn primary" data-act="unlock">$ unlock</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script src="manage.js"></script>
<script src="app.js"></script>
</body>
</html>
