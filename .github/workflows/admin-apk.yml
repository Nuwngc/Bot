name: Build botctl APK

# Tự build app Android admin (thư mục admin-app/) mỗi khi có thay đổi, hoặc bấm tay ở tab Actions > Run workflow.
# APK nằm ở: Releases > "botctl (bản mới nhất)" hoặc Actions > lần chạy > Artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "admin-app/**"
      - ".github/workflows/admin-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Chấp nhận giấy phép Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        working-directory: admin-app
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: Đổi tên APK
        run: cp admin-app/app/build/outputs/apk/release/app-release.apk botctl.apk

      - uses: actions/upload-artifact@v4
        with:
          name: botctl-apk
          path: botctl.apk

      - name: Đăng lên Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: botctl-latest
          name: botctl (bản mới nhất)
          body: |
            App Android dành riêng cho admin. Tải botctl.apk về điện thoại và cài (cho phép cài từ nguồn này nếu máy hỏi).
            Bản dựng số ${{ github.run_number }}, commit ${{ github.sha }}.
          files: botctl.apk
